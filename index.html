<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warm Up to Win, Cool Down to Last – e-Book Interaktif</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1d4a73;--teal:#6bb7c3;--rose:#a52a5b;--ink:#15181d;--paper:#fbfbfa;--mute:#5d6672;--line:#dfe3e6;--gold:#f2c14e;--ok:#2a9d6a}
*{box-sizing:border-box;margin:0}
body{font:400 14.5px/1.75 Poppins,system-ui,sans-serif;color:#14181d;background:#cdd5da}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3,h4{font-family:'Abril Fatface',Georgia,serif;font-weight:400;line-height:1.1}
img.bad{outline:2px dashed var(--rose);min-width:40px;min-height:40px}
/* bar atas */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px}
.top b{font:400 18px 'Abril Fatface',Georgia,serif;color:var(--teal)}
.top button{padding:3px 13px;border:1px solid #667;border-radius:20px;font-size:13px}.top button:hover{background:var(--navy)}
.top #tray{border-color:var(--teal);color:var(--teal)}.top #cnt{margin-left:auto;font-size:13px;color:#aab}
#bar{position:sticky;top:45px;z-index:30;height:4px;background:#0002}#bar i{display:block;height:100%;width:0;background:var(--rose);transition:width .5s}
/* drawer */
#drawer{position:fixed;top:0;left:0;bottom:0;width:330px;max-width:88vw;z-index:60;background:#fff;padding:20px 18px;overflow:auto;box-shadow:8px 0 30px #0005;animation:slide .3s both}
#drawer[hidden],#scrim[hidden]{display:none}@keyframes slide{from{transform:translateX(-100%)}}
#scrim{position:fixed;inset:0;z-index:55;background:#0a15208c}
#drawer h3{font-size:26px;color:var(--navy);margin-bottom:10px}
#drawer .it{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:500}
#drawer .it:hover{background:#eef4f6}#drawer .it.on{background:#e3eef3;font-weight:700}
#drawer .it b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:400 14px 'Abril Fatface'}
#drawer .it em{margin-left:auto;font-style:normal;font-size:10px;letter-spacing:2px;color:var(--ok)}
#drawer .gr{font:600 10.5px Poppins;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:14px 0 2px}
/* spread */
.sp{max-width:1040px;margin:20px auto;display:grid;grid-template-columns:5fr 6fr;min-height:700px;box-shadow:0 18px 40px #0004;background:var(--paper);animation:in .45s ease both}
.sp[hidden]{display:none}.sp.one{grid-template-columns:1fr;max-width:480px}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.lp{position:relative;padding:32px 30px;color:#fff;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.t-navy{background:var(--navy)}.t-rose{background:var(--rose)}.t-teal{background:#23707d}.t-dark{background:var(--ink)}
.ghost{position:absolute;right:-4px;top:-22px;font:400 190px/1 'Abril Fatface',serif;color:transparent;-webkit-text-stroke:2px #ffffff2e;pointer-events:none}
.cir{width:74px;height:74px;border:3px solid var(--teal);border-radius:50%;display:grid;place-content:center;text-align:center;font:600 9.5px/1.1 Poppins;letter-spacing:.1em;text-transform:uppercase}
.cir b{display:block;font:400 28px/1 'Abril Fatface',serif;letter-spacing:0}
.mod{font:600 10.5px Poppins;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:14px 0 8px}
.ttl{font-size:clamp(32px,4.4vw,50px)}
.sub{margin-top:10px;color:#e1ebf1;font-size:13.5px;max-width:36ch}
.pts{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px}
.pts button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;border:1.5px solid #ffffff45;font-size:12.5px;line-height:1.4;transition:.2s}
.pts button:hover{background:#ffffff22;transform:translateX(4px)}.pts i{font:400 16px 'Abril Fatface',serif;font-style:normal;color:var(--gold)}
.hero{margin-top:auto;padding-top:18px;display:flex;align-items:flex-end;justify-content:center;gap:10px}
.hero img{max-height:225px;max-width:48%;object-fit:contain;filter:drop-shadow(0 8px 10px #0005);cursor:pointer;transition:transform .3s}
.hero img:hover{transform:translateY(-6px) rotate(-2deg)}.hero img.phx{max-width:100%;max-height:185px;border-radius:8px;object-fit:cover}
.prg{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.prg span{font:600 10.5px Poppins;border:1.5px solid #fff5;border-radius:20px;padding:2px 11px;opacity:.65}
.prg span.on{background:var(--ok);border-color:var(--ok);opacity:1}
.rp{position:relative;padding:26px 28px 30px;background:radial-gradient(#1d4a7314 1.2px,transparent 1.3px) 0 0/24px 24px,var(--paper);min-width:0}
.rp h3.h3{font-size:30px;color:var(--navy);margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{padding:8px 16px;font-weight:600;font-size:13px;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tabs button:hover{color:var(--navy)}.tabs button.on{color:var(--navy);border-color:var(--rose)}
.tp[hidden]{display:none}.tp{animation:in .35s both}
.intro{font:400 17px/1.4 'Abril Fatface',serif;color:var(--navy);margin-bottom:8px}
.src{font-size:11.5px;color:var(--mute);margin-bottom:10px}
.dev{display:inline-block;background:var(--gold);color:#4a3a00;font:700 10px Poppins;border-radius:12px;padding:1px 9px;letter-spacing:.06em}
.lnk{font-size:12px;color:var(--rose);font-weight:600;margin:0 0 8px 0;text-decoration:underline}
.acc{border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.acc summary{cursor:pointer;list-style:none;padding:11px 16px;font-weight:600;display:flex;gap:12px;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:400 13px 'Abril Fatface'}
.acc summary::after{content:'+';margin-left:auto;font-size:22px;color:var(--rose);transition:transform .25s}
.acc[open] summary::after{transform:rotate(45deg)}.acc[open]{border-color:var(--teal)}
.acc .txt{padding:0 18px 12px;text-align:justify}.acc .txt p{margin-bottom:10px}
.term{border-bottom:2px dotted var(--rose);font-weight:600;cursor:help;padding:0 1px;transition:background .2s}.term:hover{background:#6bb7c366}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:14px}
.card h4{font-size:20px;color:var(--navy);margin-bottom:10px}
.btn{background:var(--navy);color:#fff;padding:8px 20px;border-radius:24px;font-weight:600;font-size:13px;transition:.2s}
.btn:hover:not(:disabled){background:var(--rose);transform:translateY(-2px)}.btn:disabled{opacity:.45;cursor:default}.btn.alt{background:var(--mute)}.btn.go{background:var(--rose)}
.ctr{text-align:center}.note{font-size:11.5px;color:var(--mute);line-height:1.55}.note.ctr{margin-top:4px}
/* widget umum */
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tb button{padding:5px 14px;border-radius:20px;border:1.5px solid var(--navy);color:var(--navy);font-size:12.5px;font-weight:500;transition:.2s}.tb button.on{background:var(--navy);color:#fff}
.pane{border-left:4px solid var(--teal);padding:2px 0 2px 14px;font-size:13px;line-height:1.6;animation:in .35s both;margin:8px 0}
.pane[hidden]{display:none}.pane.hot{border-color:var(--rose)}.pane b{color:var(--navy)}
.mr{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}.mr i{flex:0 0 130px;font-style:normal}
.mr u{flex:1;height:14px;background:#8a98a433;border-radius:8px;overflow:hidden}
.mr b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--rose));border-radius:8px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.fcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{perspective:900px;height:150px;width:100%}.fc>span{display:block;position:relative;height:100%;transition:transform .7s;transform-style:preserve-3d}.fc.on>span{transform:rotateY(180deg)}
.fc em{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;padding:12px 14px;font-style:normal;font-size:12px;line-height:1.5;display:flex;flex-direction:column;justify-content:center;text-align:left;color:#fff}
.fc .f{background:var(--rose)}.fc .k{background:var(--navy);transform:rotateY(180deg)}.fc strong{font:400 18px/1.15 'Abril Fatface',serif}.fc small{opacity:.8;margin-top:4px}
.pcard{border:1.5px solid var(--teal);border-radius:14px;padding:16px;text-align:center;font:400 22px/1.2 'Abril Fatface';min-height:100px;display:grid;place-content:center;margin:8px 0;color:var(--navy);animation:in .35s both}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 14px;border:1.5px solid var(--navy);border-radius:10px;font-size:13px;color:var(--navy);transition:.2s}
.op:hover:not(:disabled){background:var(--navy);color:#fff;transform:translateX(5px)}.two .op{text-align:center;margin:0}
.op:disabled{cursor:default}.op.ok{background:var(--ok);border-color:var(--ok);color:#fff}.op.no{background:var(--rose);border-color:var(--rose);color:#fff}
.fb{font-size:12.5px;margin:4px 0 10px;padding:8px 12px;border-radius:8px;background:#eef4f6;animation:in .3s both}
.qq{margin-bottom:12px}.qq p{margin-bottom:4px;font-weight:600}
.ar{width:100%;display:block}.ar path{fill:none;stroke:var(--navy);stroke-width:3}
input[type=range]{width:100%;accent-color:var(--rose);margin:6px 0}
.br{width:140px;height:140px;margin:8px auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6bb7c3,#1d4a73);display:grid;place-content:center;color:#fff;font:400 17px 'Abril Fatface';text-align:center;transform:scale(.6);box-shadow:0 0 0 10px #6bb7c333}
.rx{height:90px;border-radius:12px;display:grid;place-content:center;text-align:center;color:#fff;font-weight:600;background:var(--navy);cursor:pointer;user-select:none;padding:8px;transition:background .15s}.rx.go{background:var(--ok)}.rx.wt{background:var(--rose)}
#wh{width:100%;max-width:300px;display:block;margin:0 auto}
.sg{cursor:pointer;transform-origin:120px 120px;transition:transform .25s}.sg:hover,.sg:focus{transform:scale(1.06)}
.sg path{stroke:#fff;stroke-width:2}.sg text{font:400 38px 'Abril Fatface',serif;fill:#fff;pointer-events:none}.ct{font:400 22px 'Abril Fatface',serif;fill:var(--navy)}.cs{font:500 9px Poppins;fill:var(--mute)}
.sl{display:flex;gap:6px;margin:6px 0}.sl span{flex:1;height:42px;border:2px dashed #8a98a4;border-radius:10px;display:grid;place-items:center;font:400 14px 'Abril Fatface';color:#fff;transition:.4s}
.sk{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ocs{display:flex;flex-wrap:wrap;gap:6px}.ocs .op{width:auto;margin:0}.ocs .op:disabled{opacity:.25}
.bm{display:flex;justify-content:center;gap:30px}.fg{width:112px;text-align:center}.w{position:relative}.w svg{display:block;width:100%;fill:#c7dae3}
.dot{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--rose);border:3px solid #fff;box-shadow:0 0 0 0 #a52a5b99;animation:ring 1.8s infinite}
.dot:hover{transform:scale(1.25)}@keyframes ring{to{box-shadow:0 0 0 14px #a52a5b00}}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{background:#eef4f6;border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.5}
.chip b{display:block;font:400 18px 'Abril Fatface',serif;color:var(--rose)}
.warn{background:#f8e7ee;border-left:4px solid var(--rose);padding:9px 12px;font-size:12.5px;line-height:1.55;margin-top:10px}
.cvz{width:100%;display:block}#cpath{fill:none;stroke:var(--navy);stroke-width:3.5}
.hrow{display:flex;gap:12px;align-items:center;margin-top:8px}.ht{flex:0 0 44px;animation:beat var(--bt,1.4s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.pbar{height:10px;border-radius:6px;background:#8a98a433;overflow:hidden;margin:6px 0 10px}.pbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--ok));transition:width .6s}
.cd{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;font-size:13px;line-height:1.5;transition:.25s}
.cd i{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--teal);display:grid;place-items:center;font-style:normal;transition:.3s}.cd:hover{border-color:var(--teal)}
.cd.on{background:#2a9d6a22;border-color:var(--ok)}.cd.on i{background:var(--ok);border-color:var(--ok);color:#fff}.cd strong{display:block;color:var(--navy)}
.alert{border-radius:10px;padding:10px 14px;margin-top:10px;font-weight:600;font-size:13px}.alert.bad{background:#f8e7ee;border-left:5px solid var(--rose);color:#6c1a3b;animation:shake .45s 2}.alert.good{background:#e2f4ec;border-left:5px solid var(--ok);color:#16543a}
.flags label{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;line-height:1.5}.flags input{accent-color:var(--rose);margin-top:5px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px}.calc label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.calc select{padding:7px;border:1.5px solid var(--line);border-radius:6px;font:inherit;background:#fff}.calc .full{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}
.stk{position:relative;display:flex;height:44px;margin-top:12px;border-radius:22px;overflow:hidden;box-shadow:0 4px 10px #0002}
.stk button{color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;transition:filter .3s}.stk button:hover,.stk .act{filter:brightness(1.3)}
.phm{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff4;border-right:3px solid #fff;pointer-events:none}
#tot{font:400 28px 'Abril Fatface',serif;color:var(--rose);margin-top:8px}
.gau{width:100%;max-width:280px;display:block;margin:0 auto}.gau path{fill:none;stroke-width:14}
#nd{transform-origin:100px 100px;transition:transform .7s cubic-bezier(.3,1.4,.5,1);stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.rg{display:flex;flex-direction:column;font-size:12.5px;margin:8px 0 0}
/* studio, kamus, lencana */
.fld{position:relative;height:430px;margin:16px 0 12px;border-radius:12px;overflow:hidden;background:linear-gradient(#e9d5b7,#dcc29c);border:3px solid #fff3;touch-action:none}
.fld::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #fff9}.fld::after{content:"";position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px;border:3px solid #fff9;border-radius:50%}
.dg{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;z-index:2;filter:drop-shadow(0 5px 5px #0005)}.dg:active{cursor:grabbing}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gi{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.35;transition:.2s}.gi:hover{border-color:var(--teal)}
.gi img{flex:0 0 46px;width:46px;height:46px;object-fit:contain;background:#eef4f6;border-radius:6px}.gi strong{display:block}.gi small{color:var(--mute)}
.gi em{margin-left:auto;font:700 9.5px Poppins;font-style:normal;color:#fff;background:var(--ok);border-radius:10px;padding:1px 8px}.gi em.x{background:var(--rose)}
.ksr{width:100%;padding:10px 16px;border:0;border-radius:24px;font:inherit;margin:14px 0 12px}
.kl{display:flex;flex-wrap:wrap;gap:7px;max-height:420px;overflow:auto}
.kl .term{border:1.5px solid #fff7;border-radius:20px;padding:3px 13px;font-size:12.5px;font-weight:500}.kl .term:hover{background:#fff;color:var(--navy)}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{border-radius:14px;padding:12px 6px;text-align:center;border:1.5px dashed var(--line);opacity:.5;font-size:11px;line-height:1.35;transition:.4s;background:#fff}
.bd b{display:block;font:400 28px 'Abril Fatface';color:#c4ccd2}.bd strong{display:block;font-size:12px}.bd small{display:block;color:var(--mute)}
.bd.on{opacity:1;border:1.5px solid var(--gold);background:#fff8e1}.bd.on b{color:var(--gold)}
.map{display:grid;gap:8px}.mc{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;transition:.2s}
.mc:hover{border-color:var(--rose);transform:translateX(5px)}.mc b{flex:0 0 36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:400 17px 'Abril Fatface'}
.mc strong{display:block;font-size:13.5px;line-height:1.3}.mc small{color:var(--mute);font-size:11px}.mc em{margin-left:auto;font-style:normal;color:var(--ok);letter-spacing:2px;font-size:12px}
.qbox{background:#fff;color:#14181d;border-radius:14px;padding:16px 18px;margin-top:16px}
.sc{font:400 36px 'Abril Fatface';color:var(--rose);text-align:center}
/* sampul */
.cv{position:relative;min-height:760px;padding:44px 38px;overflow:hidden;background:radial-gradient(#1d4a7314 1.2px,transparent 1.3px) 0 0/24px 24px,#fff}
.cv .logo{position:absolute;right:34px;top:30px;width:84px;animation:pulse 3s ease-in-out infinite}
.cv h1{font:700 62px/1 Arial,sans-serif;margin-top:150px;position:relative;z-index:2}
.csub{font:400 19px/1.3 Arial,sans-serif;margin-top:22px;max-width:268px;position:relative;z-index:2}
.ctag{margin-top:18px;font-size:13px;color:var(--mute);position:relative;z-index:2}
.cv .btn.big{margin-top:22px;padding:11px 28px;position:relative;z-index:3}
.spin{position:absolute;right:24px;top:322px;width:132px;z-index:3;animation:rot 18s linear infinite}
.n8{position:absolute;right:24px;top:322px;width:132px;height:132px;z-index:3;display:grid;place-content:center;text-align:center;font:400 40px/1 'Abril Fatface',serif;color:var(--rose)}.n8 small{font:600 11px Poppins;color:var(--navy)}
.sil{position:absolute;right:0;bottom:0;width:94%;cursor:pointer}
.fl{position:absolute;z-index:3;filter:drop-shadow(0 6px 6px #0003);animation:bob 4s ease-in-out infinite;cursor:pointer}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes bob{50%{transform:translateY(-14px) rotate(8deg)}}
/* modal tunggal, toast */
#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0a1520d0;padding:16px;animation:fade .2s}
#modal[hidden]{display:none}@keyframes fade{from{opacity:0}}
#mcard{background:#fff;border-top:9px solid var(--c,var(--teal));border-radius:14px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:26px 26px 22px;position:relative;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}}
#mx{position:absolute;right:10px;top:8px;font-size:26px;width:36px;height:36px;border-radius:50%}#mx:hover{background:#eee}
#mt{font-size:27px;color:var(--navy);margin-bottom:10px;padding-right:30px}#mb p{margin-bottom:10px}
.tr{position:relative;width:104px;height:104px;margin:6px auto}.tr svg{width:100%}.tr b{position:absolute;inset:0;display:grid;place-items:center;font:400 28px 'Abril Fatface',serif;color:var(--rose)}
#toasts{position:fixed;top:62px;right:14px;z-index:90;display:grid;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-left:5px solid var(--gold);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 6px 18px #0005;animation:tin .35s both;transition:.4s}
.toast.out{opacity:0;transform:translateX(30px)}@keyframes tin{from{opacity:0;transform:translateX(40px)}}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:95;animation:fall 2.4s ease-in both;pointer-events:none}@keyframes fall{to{transform:translateY(108vh) rotate(var(--r))}}
.nav{max-width:1040px;margin:0 auto 34px;display:flex;justify-content:space-between;padding:0 6px}

CWdwKyg4/hRWEnfEmAfkqLyq2VwdqyHdaHRuNPY0oiUQ3Esb4OV7Eh3Zh98vJxMycLP1GqElYuPrq/BglKXY/wr7Ff4SMB3fCMmBRw4JPXfJ0gOpOpbkvQCEat/s+wU/buru6On3iXePP/9pQBUOdnEwqqGQsF8LSgCEjAAAAAAAA"};const MATERI={"b1": ["Miskonsepsi tradisional yang menganggap peregangan statis berdurasi panjang sebagai metode pemanasan terbaik telah berakar cukup lama di dunia olahraga. Praktik menahan satu posisi regangan diam selama puluhan detik saat kondisi tubuh masih dingin dahulu diyakini mampu melenturkan otot dan mencegah cedera. Namun, penemuan sains olahraga modern membuktikan bahwa melakukan peregangan statis secara berlebihan sebelum latihan intensif justru memberikan dampak buruk terhadap performa fisik, khususnya pada aktivitas yang membutuhkan kekuatan, kecepatan, dan daya ledak.", "Secara fisiologis, penurunan performa ini disebabkan oleh beberapa mekanisme utama. Ketika otot diregangkan secara statis dalam waktu yang cukup lama, sensitivitas muscle spindle—yaitu reseptor saraf sensorik di dalam otot—akan menurun secara signifikan. Kondisi ini menumpulkan respons stretch reflex dan menghambat pelepasan sinyal saraf dari otak ke otot, sehingga otot kehilangan kemampuannya untuk berkontraksi secara cepat dan kuat. Selain itu, peregangan statis menurunkan tingkat kekakuan alami pada unit otot dan tendon. Tendon yang ideal membutuhkan tingkat kekakuan tertentu agar dapat berfungsi seperti pegas yang menyimpan serta melepaskan energi mekanis secara efisien. Ketika jaringan tersebut terlalu kendor akibat peregangan statis, kemampuan tubuh untuk menghasilkan daya ledak seperti lompatan atau akselerasi sprint akan menurun drastis.", "Perbandingan antara peregangan statis dan dinamis memperlihatkan perbedaan fungsi yang sangat tegas. Peregangan statis memang efektif untuk meningkatkan fleksibilitas pasif, namun sifatnya meregangkan jaringan tanpa menaikkan suhu tubuh atau memicu aliran darah secara aktif, sehingga lebih tepat dialokasikan pada sesi pendinginan setelah latihan. Sebaliknya, peregangan dinamis melibatkan gerakan aktif pada seluruh rentang gerak sendi. Pendekatan dinamis ini secara efektif menaikkan suhu inti tubuh, melumasi sendi dengan cairan sinovial, serta memicu kesiapan sistem saraf tanpa mengurangi kekuatan puncak otot, menjadikannya pilihan utama untuk fase awal pemanasan.", "Perlu dicatat bahwa dampak negatif peregangan statis bergantung pada dosis. Kajian sistematis umumnya menemukan penurunan performa yang bermakna ketika satu otot ditahan sekitar satu menit atau lebih, sedangkan penahanan singkat di bawah 45 detik berpengaruh kecil. Artinya, peregangan statis bukan sesuatu yang \"terlarang\", melainkan harus ditempatkan dan ditakar dengan benar. Pada tahap pemanasan ia sebaiknya digantikan gerakan dinamis, sedangkan setelah latihan ia berguna untuk menjaga rentang gerak. Cabang yang menuntut fleksibilitas ekstrem, seperti senam atau balet, memiliki kebutuhan berbeda dan perlu disesuaikan."], "b2": ["Pergerakan manusia merupakan hasil koordinasi kompleks yang dikendalikan langsung oleh sistem saraf pusat. Proses ini diawali dari perintah di otak dan medula spinalis, melintasi jalur saraf perifer, hingga akhirnya mengaktifkan unit motorik di dalam jaringan otot. Untuk menghasilkan gerakan yang eksplosif dan responsif, sistem saraf harus mampu merekrut serat otot bertipe cepat secara kilat. Proses aktivasi dinamis berfungsi melumasi jalur komunikasi neuromuskular ini agar sinyal perintah dari otak dapat ditransmisikan ke serat otot dengan latensi sekecil mungkin.", "Kesiapan fisik yang prima tidak akan bekerja optimal tanpa didukung oleh tingkat kesiapsiagaan mental atau arousal yang tepat. Berdasarkan prinsip hubungan antara kebangkitan mental dan kinerja fisik, tingkat arousal yang terlalu rendah membuat waktu reaksi tubuh menjadi lambat dan kurang responsif. Sebaliknya, kondisi kecemasan yang berlebihan justru merusak kontrol motorik halus. Aktivasi dinamis membantu atlet mencapai zona fokus optimal dengan menyelaraskan kesiapan pikiran dan otot, sehingga koordinasi antar-kelompok otot dapat berjalan secara harmonis saat mengeksekusi gerakan berintensitas tinggi.", "Menerapkan aktivasi dinamis dapat dilakukan melalui kombinasi latihan fisik reaktif dan teknik fokus mental. Gerakan fisik seperti variasi lari frekuensi tinggi, langkah lateral, dan simulasi reaksi tangkap mempercepat konduksi saraf sekaligus mengasah koordinasi tubuh. Di saat yang sama, latihan pernapasan teratur yang dipadukan dengan visualisasi singkat membantu menenangkan sistem saraf otonom. Sinergi antara kesiapan saraf pusat dan kestabilan mental ini memastikan tubuh siap menghadapi tuntutan beban latihan yang berat dengan tingkat presisi gerakan yang tinggi.", "Hubungan antara arousal dan performa sering digambarkan sebagai kurva huruf U terbalik (hukum Yerkes–Dodson): performa memuncak pada arousal sedang, lalu menurun bila terlalu rendah atau terlalu tinggi. Titik puncaknya berbeda-beda; tugas halus seperti panahan membutuhkan arousal lebih rendah daripada tugas bertenaga seperti angkat besi. Karena itu, atlet perlu mengenali zona pribadinya. Pernapasan lambat, rutinitas pra-tanding yang konsisten, dan visualisasi singkat adalah alat sederhana untuk menggeser arousal ke zona tersebut tanpa peralatan apa pun."], "b3": ["Arsitektur pemanasan atletik modern yang paling terstruktur dan diakui secara luas adalah protokol RAMS, yang merupakan akronim dari empat tahapan utamanya: Raise, Activate, Mobilize, dan Potentiate. Protokol ini dirancang secara berurutan untuk mentransformasikan kondisi tubuh dari keadaan istirahat menuju kondisi puncak yang siap menerima beban latihan fisik tanpa kejutan metabolisme maupun biomekanika.", "Tahap pertama, yaitu Raise, bertujuan untuk meningkatkan suhu inti tubuh, denyut jantung, aliran darah, serta viskositas cairan di dalam sendi melalui aktivitas kardiovaskular ringan. Setelah sirkulasi darah terpacu, pemanasan dilanjutkan ke tahap Activate. Pada fase ini, fokus diarahkan untuk mengaktifkan otot-otot stabilisator kunci yang sering kali pasif setelah beraktivitas seharian, seperti otot panggul dan otot inti, demi menjaga postur tubuh yang aman saat bergerak.", "Dua tahap terakhir dari protokol ini berfokus pada persiapan gerak spesifik dan kesiapan daya ledak. Pada tahap Mobilize, atlet melakukan gerakan dinamis untuk membuka rentang gerak sendi-sendi utama seperti pergelangan kaki, pinggul, dan bahu secara aktif. Pemanasan kemudian ditutup dengan tahap Potentiate, yaitu pemberian stimulasi berupa gerakan eksplosif berintensitas tinggi yang serupa dengan aktivitas utama. Fase potensiasi ini memicu fenomena post-activation potentiation, di mana sistem saraf pusat dirangsang hingga kapasitas maksimalnya agar tubuh siap menghasilkan daya ledak tinggi sejak detik pertama latihan dimulai.", "RAMS diperkenalkan oleh pelatih Ian Jeffreys (2007) agar pemanasan tidak menjadi kumpulan gerakan acak, melainkan proses yang terukur. Sebagai gambaran, Raise cukup beberapa menit hingga tubuh berkeringat ringan, Activate dan Mobilize memakai gerakan yang dipilih menurut kebutuhan sendi, dan Potentiate hanya beberapa pengulangan singkat. Dalam literatur, fenomena potensiasi kini sering disebut post-activation performance enhancement (PAPE), karena yang dirasakan atlet adalah peningkatan performa. Efeknya sangat dipengaruhi kelelahan: stimulus yang terlalu berat atau jeda yang terlalu pendek justru dapat merugikan."], "b4": ["Prinsip spesifisitas menegaskan bahwa setiap cabang olahraga memiliki tuntutan metabolik, pola gerak, dan karakteristik cedera yang berbeda, sehingga pendekatan pemanasan pun tidak boleh disamaratakan. Pemanasan untuk olahraga berdaya ledak tinggi harus dirancang sangat berbeda dibandingkan dengan pemanasan untuk olahraga yang mengandalkan daya tahan kardiorespirasi.", "Olahraga bersifat eksplosif seperti basket dan futsal sangat mengandalkan sistem energi anaerobik cepat serta rekrutmen serat otot tipe dua. Cabang olahraga ini dipenuhi oleh pola gerakan akselerasi, deselerasi mendadak, lompatan vertikal, dan perubahan arah yang cepat pada berbagai bidang gerak. Oleh sebab itu, pemanasan spesifiknya memerlukan penekanan kuat pada aktivasi saraf melalui latihan lompatan plyometrik ringan, kelincahan, dan simulasi gerakan reaktif untuk melatih toleransi otot terhadap beban kejut yang tinggi.", "Sebaliknya, olahraga ketahanan seperti lari jarak jauh atau bersepeda bertumpu pada sistem energi aerobik yang bekerja secara konstan dan berulang. Tuntutan utamanya adalah efisiensi pernapasan dan ekonomi gerak. Pemanasan untuk cabang ketahanan dilakukan secara lebih bertahap dengan memfokuskan peningkatan kecepatan secara perlahan, membuka mobilitas sendi pada bidang gerak linier, dan diakhiri dengan beberapa akselerasi singkat. Pemanasan ketahanan dirancang tidak terlalu lama atau intens agar tidak menghabiskan cadangan glikogen dan energi utama sebelum sesi latihan atau perlombaan dimulai.", "Prinsip spesifisitas juga berlaku pada olahraga campuran seperti sepak bola atau tenis, yang memadukan lari berulang dengan ledakan singkat; pemanasannya menggabungkan Raise bertahap dengan Potentiate yang menyerupai permainan. Perhatikan pula jeda antara pemanasan dan awal pertandingan: bila terlalu lama, manfaat suhu otot menurun, sehingga pemain cadangan perlu menjaga tubuhnya tetap hangat. Tinjauan sistematis atas puluhan studi menemukan bahwa sebagian besar melaporkan peningkatan performa setelah pemanasan aktif, tetapi hasilnya tidak seragam. Pemanasan terbaik adalah yang diuji dan disesuaikan dengan respons tiap atlet."], "b6": ["Selain menurunkan frekuensi denyut jantung ke zona aman, pemulihan fisik yang komprehensif menuntut perhatian khusus pada kesehatan fascia, yaitu jaringan ikat pembungkus yang menyelimuti seluruh struktur otot, pembuluh darah, dan serat saraf. Beban latihan yang berat dan berulang sering kali memicu adhesi atau penumpukan ikatan mikroskopis pada lapisan fascia ini. Kondisi tersebut membentuk titik-titik sensitif yang sangat kaku dan nyeri (trigger point), yang tidak hanya membatasi rentang gerak alami sendi, tetapi juga mengganggu arus sinyal listrik saraf ke otot.", "Pendekatan Self-Myofascial Release (SMR) menggunakan alat bantu seperti foam roller atau bola pijat bekerja dengan memberikan tekanan mekanis terarah pada jaringan lunak. Secara fisiologis, tekanan konstan ini merangsang organ tendon Golgi sebagai reseptor sensorik yang peka terhadap perubahan ketegangan. Rangsangan tersebut memicu refleks autogenik yang memerintahkan otak untuk merilekskan ketegangan otot secara mendalam. Di saat yang sama, kompresi mekanis membantu memeras cairan interstitial yang tertahan di jaringan fascia kaku, sehingga saat tekanan dilepas, aliran darah segar beroksigen dan kaya nutrisi dapat mengalir masuk untuk mempercepat proses regenerasi sel.", "Penerapan teknik SMR secara mandiri membutuhkan presisi dan kepatuhan pada prinsip keselamatan dasar. Gerakkan foam roller secara perlahan dengan kecepatan sekitar satu hingga dua sentimeter per detik melintasi kelompok otot utama seperti betis, paha depan, paha belakang, gluteus, hingga paha samping selama 30 hingga 60 detik per area. Saat gulungan melewati titik yang terasa sangat kaku, hentikan gerakan dan tahan posisi tepat di atas titik tersebut selama 20 hingga 30 detik hingga sensasi tegang berangsur melunak. SMR harus diterapkan secara bijak pada area berdaging dan dilarang keras menekan struktur tulang kaku secara langsung seperti tulang belakang lumbal, persendian utama, serta jaringan yang sedang mengalami cedera akut, luka terbuka, atau pembengkakan hebat. Jika muncul sensasi nyeri tajam menjalar atau kesemutan, tindakan harus segera dihentikan.", "Penting untuk jujur tentang kekuatan bukti. Tinjauan sistematis menunjukkan foam rolling dapat meningkatkan rentang gerak dalam jangka pendek tanpa menurunkan performa otot, dan sedikit meredakan nyeri akibat DOMS. Namun mekanismenya masih diperdebatkan; sebagian peneliti menilai efeknya lebih berkaitan dengan perubahan persepsi nyeri dan modulasi saraf daripada \"melepaskan\" fascia secara fisik. Karena itu, tekanan sebaiknya terasa sebagai nyeri nyaman yang masih bisa ditoleransi sambil bernapas teratur, bukan menyakitkan. Foam rolling singkat dapat dipakai saat pemanasan, tetapi tidak menggantikan gerakan dinamis."], "b7": ["Cedera pada aktivitas olahraga jarang sekali terjadi secara mendadak tanpa sinyal awal. Sebagian besar gangguan fungsi otot dan sendi bermula dari akumulasi kerusakan mikroskopis pada serat otot (micro-tears) yang tidak sempat terpulihkan dengan sempurna. Fenomena ini paling sering dipicu oleh kegagalan proses transisi, baik lonjakan beban kerja yang mendadak akibat pemanasan yang buruk, maupun penghentian latihan secara drastis tanpa melewati fase pendinginan yang terstruktur.", "Kegagalan dalam melewati tahap-tahap pemanasan modern menciptakan gangguan mekanis dan kardiovaskular yang khas pada tubuh. Memaksa otot berkontraksi secara eksplosif saat suhu jaringan masih dingin dan sistem saraf belum siap sering memicu kram otot dan strain ringan. Hal ini diperparah oleh ketidakseimbangan pasokan elektrolit dan kelelahan sinyal saraf yang membuat refleks regang menjadi tidak stabil. Sementara itu, pengabaian tahap Activate dan Mobilize menyebabkan otot stabilisator panggul atau pergelangan kaki belum pasif, sehingga penurunan kemampuan tubuh dalam menyerap gaya benturan saat mendarat berdampak pada cedera shin splints dan nyeri lutut akibat beban kejut yang diserap berlebihan oleh tulang kering dan sendi lutut.", "Sangat penting bagi setiap individu untuk membedakan antara pegal pasca-latihan biasa (DOMS) dengan tanda cedera struktural (red flags). Apabila muncul gejala seperti pembengkakan masif yang membesar cepat, ketidakmampuan menopang berat badan, rasa sendi terkunci, deformitas struktur tulang, atau rasa nyeri hebat yang menetap lebih dari 48 jam, maka seluruh intervensi mandiri harus segera dihentikan untuk dirujuk ke spesialis kedokteran olahraga atau fisioterapis.", "Pegal otot tertunda (DOMS) biasanya mulai terasa beberapa jam setelah latihan, memuncak sekitar satu hingga tiga hari, lalu mereda; ia lebih sering muncul pada gerakan baru atau beban yang naik tiba-tiba. Pencegahan paling efektif adalah peningkatan beban yang bertahap, tidur dan nutrisi yang cukup, serta transisi yang baik di awal dan akhir sesi. Bila ragu, pegal merata di kedua sisi yang membaik tiap hari umumnya wajar, sedangkan nyeri tajam di satu titik yang memburuk atau mengganggu berjalan perlu diperiksa. E-book ini bersifat edukatif dan tidak menggantikan pemeriksaan tenaga kesehatan."], "b8": ["Sinergi antara sains olahraga dan kemajuan teknologi informasi kini memungkinkan penyusunan dosis pemanasan dan pendinginan dilakukan secara presisi berbasis data individual. Kalkulator durasi pemanasan mandiri hadir sebagai instrumen digital yang memproses berbagai variabel fisiologis dan lingkungan untuk menghasilkan rekomendasi waktu serta alokasi intensitas yang ideal sebelum bertanding atau berlatih.", "Algoritma pemrosesan data pada kalkulator ini bekerja dengan memperhitungkan tiga parameter utama. Pertama, karakteristik olahraga menentukan porsi pemanasan, di mana aktivitas eksplosif berbasis kecepatan membutuhkan alokasi lebih besar pada tahap Potentiate, sedangkan olahraga ketahanan secara otomatis memprioritaskan durasi yang lebih panjang pada tahap Raise dan Mobilize. Kedua, kondisi lingkungan teknis seperti suhu udara dingin menuntut peningkatan durasi tahap Raise secara otomatis demi memastikan suhu inti tubuh dan cairan sinovial sendi mencapai ambang optimal. Ketiga, profil fisiologis individu mencakup faktor usia, tingkat kebugaran, dan riwayat cedera yang menentukan rentang waktu penyesuaian sistem pembuluh darah dan jaringan lunak.", "Kendati kalkulator digital mampu menyajikan data matematis yang presisi, pengguna harus tetap mampu bersikap kritis terhadap hasil keluaran teknologi tersebut. Teknologi berfungsi sebagai panduan dasar, namun indikator terbaik dari kesiapan fisik adalah respons internal tubuh sendiri melalui Rate of Perceived Exertion. Kemampuan membaca sinyal tubuh seperti tingkat kelonggaran sendi, kelancaran pernapasan, dan fokus mental merupakan puncak keterampilan seorang praktisi yang mampu memadukan presisi data digital dengan kepekaan fisiologis secara mandiri.", "Kalkulator pada bab ini adalah model heuristik sederhana, bukan alat ukur klinis yang telah divalidasi. Angka menitnya merupakan titik awal yang masuk akal, lalu disesuaikan dengan kondisi hari itu: kurang tidur, stres, atau tubuh yang kurang sehat dapat mengubah kebutuhan Anda. Kebiasaan mencatat durasi pemanasan dan skor RPE di setiap sesi akan membuat hasilnya semakin personal. Dengan cara ini teknologi berperan sebagai asisten yang mengajukan hipotesis, sedangkan tubuh yang mengujinya dan mengoreksinya."], "h": {"b1": "Bab 1 – Mitos & Fakta: Stretching Statis Sebelum Latihan Menurunkan Performa", "b2": "Bab 2 – Psikologi & Kesiapan Saraf Pusat melalui Dynamic Activation", "b3": "Bab 3 – Protokol RAMS (Raise, Activate, Mobilize, Potentiate)", "b4": "Bab 4 – Sport-Specific Warm-Up: Explosive vs Endurance", "b6": "Bab 6 – Myofascial Release Mandiri: Foam Roller & Self-Massage", "b7": "Bab 7 – Troubleshooting Cedera Mikro Akibat Gagal Transisi", "b8": "Bab 8 – Lampiran Digital: Kalkulator Durasi Pemanasan Mandiri & Rencana Akhir"}, "mod": {"b1": "Modul 1 – Fondasi Neuromuskular", "b3": "Modul 2 – Arsitektur Pemanasan Modern", "b7": "Modul 4 – Integrasi TIK"}, "b5": ["Cool down adalah fase penutup yang membawa tubuh dari beban latihan menuju keadaan istirahat secara bertahap, sebagaimana pemanasan membawa tubuh naik secara bertahap.\n\nSetelah aktivitas berat, denyut jantung dan tekanan darah masih tinggi dan pembuluh darah di tungkai melebar. Jika seseorang berhenti mendadak, darah cenderung menumpuk di kaki sehingga aliran balik ke jantung menurun, dan sebagian orang merasa pusing atau melayang. Gerakan ringan membantu otot tungkai tetap memompa darah kembali ke jantung, sehingga denyut jantung dan napas turun lebih halus.", "Secara praktis, cool down dapat disusun dalam lima langkah. Pertama, turunkan intensitas bertahap selama sekitar lima hingga sepuluh menit, misalnya dari lari menjadi jogging, lalu jalan santai. Kedua, pantau sinyal tubuh melalui napas, kelonggaran sendi, dan fokus (RPE).\n\nKetiga, lakukan peregangan statis ringan sekitar 15–30 detik per otot utama. Inilah saat yang tepat bagi peregangan statis yang pada Bab 1 tidak dianjurkan sebelum latihan. Keempat, bila perlu gunakan foam roller (Bab 6). Kelima, penuhi kebutuhan cairan dan makan setelahnya, serta catat kondisi tubuh sebagai bahan evaluasi sesi berikutnya.", "Ulasan ilmiah menunjukkan bahwa bukti manfaat cool down untuk mencegah DOMS dan cedera masih terbatas dan hasilnya belum konsisten. Manfaat yang paling jelas bersifat fisiologis jangka pendek, yaitu pemulihan denyut jantung dan tekanan darah yang lebih nyaman, serta kesempatan untuk menenangkan diri dan mengevaluasi sesi.\n\nKarena itu cool down sebaiknya dipahami sebagai kebiasaan pendukung berisiko rendah, bukan jaminan bebas cedera. Sikap ini selaras dengan semangat e-book: setiap klaim dibaca bersama kekuatan buktinya.", "Jadikan cool down ritual penutup yang sama di setiap sesi, seperti halnya pemanasan, agar tubuh dan pikiran terbiasa beralih dari mode tampil ke mode pulih. Meskipun bukti pencegahan cedera belum kuat, kebiasaan ini murah, aman, dan memberi Anda waktu untuk membaca sinyal tubuh."]};</script>

const G={spindle:['Muscle spindle','Reseptor saraf sensorik di dalam otot. Peregangan statis lama menurunkan sensitivitasnya, sehingga refleks regang tumpul dan sinyal dari otak ke otot melemah.'],
stiff:['Kekakuan (stiffness)','Tingkat kekakuan alami unit otot dan tendon. Tendon yang cukup kaku bekerja seperti pegas yang menyimpan dan melepas energi mekanis secara efisien.'],
sino:['Cairan sinovial','Cairan pelumas di dalam sendi. Gerakan dinamis menaikkan suhu dan melumasi sendi sebelum latihan.'],

arousal:['Arousal','Tingkat kesiapsiagaan mental. Terlalu rendah membuat reaksi lambat, terlalu tinggi (cemas) merusak kontrol motorik halus.'],
fascia:['Fascia','Jaringan ikat yang membungkus otot, pembuluh darah, dan serat saraf.'],
trig:['Trigger point','Titik sensitif yang sangat kaku dan nyeri akibat adhesi pada fascia. Membatasi gerak sendi dan mengganggu sinyal saraf ke otot.'],

doms:['DOMS','Pegal pasca-latihan biasa. Berbeda dari cedera struktural yang ditandai red flags.'],
rpe:['RPE','Rate of Perceived Exertion: penilaian respons internal tubuh, seperti kelonggaran sendi, kelancaran napas, dan fokus mental.'],

elek:['Elektrolit','Mineral yang membantu sinyal saraf dan kontraksi otot. Ketidakseimbangannya dapat memicu kram.'],

aerob:['Sistem energi aerobik','Penghasil energi yang bekerja konstan dan berulang, andalan olahraga ketahanan seperti lari jarak jauh dan bersepeda.'],
refleks:['Refleks regang','Respons otot saat diregangkan yang membantu kontraksi cepat. Peregangan statis yang lama menumpulkannya.'],

rams:['RAMS','Raise, Activate, Mobilize, Potentiate: empat tahap pemanasan yang berurutan, dari tubuh istirahat menuju kondisi puncak.']};
const AL=[['post-activation potentiation','pap'],['Rate of Perceived Exertion','rpe'],['organ tendon Golgi','golgi'],['muscle spindle','spindle'],['cairan sinovial','sino'],['unit motorik','unit'],['trigger point','trig'],['shin splints','shin'],['micro-tears','micro'],['refleks regang','refleks'],['plyometrik','plio'],['glikogen','gliko'],['elektrolit','elek'],['anaerobik','anaerob'],['aerobik','aerob'],['arousal','arousal'],['kekakuan','stiff'],['fascia','fascia'],['latensi','latensi'],['DOMS','doms'],['strain','strain']];

function quiz(host,qs,o){let i=0,sc=0,an=0;o=o||{};
 function draw(){host.innerHTML=qs.map((q,k)=>o.one&&k!==i?'':'<div class="qq"><p>'+(k+1)+'. '+q[0]+'</p>'+q[1].map((x,j)=>'<button class="op" data-k="'+k+'" data-j="'+j+'">'+x+'</button>').join('')+'<div class="fb" hidden></div></div>').join('')+'<p class="note qs"></p>';an=0}
 host.onclick=e=>{const nb=e.target.closest('[data-nx]');if(nb){if(i<qs.length-1){i++;draw()}else{host.innerHTML='<p class="sc">Skor '+sc+'/'+qs.length+'</p><p class="ctr"><button class="btn" data-rs="1">Ulangi</button></p>';o.done&&o.done(sc,qs.length)}return}
  if(e.target.closest('[data-rs]')){if(o.fresh)qs=o.fresh();i=0;sc=0;draw();return}
  const b=e.target.closest('.op');if(!b||b.disabled)return;const k=+b.dataset.k,j=+b.dataset.j,q=qs[k],qq=b.closest('.qq'),ok=j===q[2];
  qa('.op',qq).forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('no');if(ok)sc++;an++;
  const fb=qq.querySelector('.fb');fb.hidden=false;fb.innerHTML='<b>'+(ok?'Benar. ':'Belum tepat. ')+'</b>'+q[3]+(o.one?'<p class="ctr" style="margin-top:8px"><button class="btn" data-nx="1">'+(i<qs.length-1?'Soal berikutnya':'Lihat skor')+'</button></p>':'');
  if(!o.one&&an>=qs.length){host.querySelector('.qs').textContent='Skor '+sc+'/'+qs.length+'. Jawaban sudah terkunci.';o.done&&o.done(sc,qs.length)}};
 draw()}
